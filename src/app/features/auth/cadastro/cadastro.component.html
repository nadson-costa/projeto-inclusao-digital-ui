<form [formGroup]="form" (ngSubmit)="submit()" class="min-h-screen bg-bg-light flex flex-col pb-28">

  <div class="flex items-center gap-3 px-6 py-4 bg-bg-dark">
    <a routerLink="/login" class="flex items-center justify-center w-10 h-10 rounded-full bg-white/10 min-w-[40px]">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h1 class="text-white text-xl font-semibold">Criar conta</h1>
  </div>

  <div class="flex flex-col gap-5 px-6 pt-6">
    <h2 class="text-orange-primary text-lg font-bold">Seus dados</h2>

    <app-input
      label="Nome completo"
      placeholder="Como você se chama"
      formControlName="nomeCompleto"
      [error]="fieldError('nomeCompleto')"
    />
    <app-input
      label="E-mail"
      type="email"
      placeholder="seu@email.com"
      formControlName="email"
      [error]="fieldError('email')"
    />
    <app-input
      label="CPF"
      placeholder="000.000.000-00"
      formControlName="cpf"
      [error]="fieldError('cpf')"
    />
    <app-input
      label="Data de nascimento"
      type="date"
      formControlName="dataNascimento"
      [error]="fieldError('dataNascimento')"
    />
    <app-input
      label="Telefone"
      type="tel"
      placeholder="(00) 00000-0000"
      formControlName="telefone"
      [error]="fieldError('telefone')"
    />
    <app-input
      label="Senha"
      type="password"
      placeholder="Mínimo 6 caracteres"
      formControlName="senha"
      [error]="fieldError('senha')"
    />
  </div>

  <div class="flex flex-col gap-5 px-6 pt-6">
    <h2 class="text-orange-primary text-lg font-bold">Contato de emergência</h2>

    <app-input
      label="Nome"
      placeholder="Nome do contato"
      formControlName="emergenciaNome"
      [error]="fieldError('emergenciaNome')"
    />
    <app-input
      label="Telefone"
      type="tel"
      placeholder="(00) 00000-0000"
      formControlName="emergenciaTelefone"
      [error]="fieldError('emergenciaTelefone')"
    />
    <app-input
      label="Parentesco"
      placeholder="Ex: Filho, Filha, Neto..."
      formControlName="emergenciaParentesco"
      [error]="fieldError('emergenciaParentesco')"
    />
  </div>

  @if (erro()) {
    <p class="text-sm text-red-600 text-center px-6 pt-4">{{ erro() }}</p>
  }

  <div class="fixed bottom-0 left-0 right-0 bg-white px-6 py-4 border-t border-border-base">
    <app-button label="Criar conta" nativeType="submit" [loading]="loading()" />
  </div>

</form>
